---

name: Operación conmutativa
theory: |
  "La suma no cambia al cambiar el orden de los sumandos" es una de las leyes básicas de la aritmética, también conocida como **ley conmutativa**. Una operación binaria se considera conmutativa si se obtiene el mismo resultado al intercambiar los operandos. En este caso, la suma es una operación conmutativa: `3 + 2 = 2 + 3`.

  Sin embargo, la resta no es una operación conmutativa: `2 - 3 ≠ 3 - 2`. En programación, esta ley funciona de la misma manera que en aritmética. Además, la mayoría de las operaciones con las que nos encontramos en la vida real no son conmutativas. Por lo tanto, siempre preste atención al orden con el que estás trabajando.

instructions: |

  Escribe un programa que resuelva dos problemas y muestre las respuestas en pantalla, cada una en una línea distinta.

  1. Un pintor quiere pintar 8 secciones de una cerca, cada una de uno de 2 colores. ¿Cuántas formas distintas de pintarla existen? Cada sección nueva duplica el número de opciones, es decir, la respuesta es el número de colores elevado al número de secciones. Usa el operador de potencia `**`. A su izquierda va la base, es decir, el número de colores, y a su derecha el exponente, es decir, el número de secciones. El orden de los operandos importa, porque `a ** b` y `b ** a` dan resultados distintos.
  2. Tú y dos amigos (3 personas en total) compraron 9 pasteles y quieren repartirlos a partes iguales. ¿Cuántos le tocan a cada uno? Usa el operador de división `/`.

tips:
  - |
    [Más información sobre la conmutatividad](https://es.wikipedia.org/wiki/Conmutatividad)

definitions:
  - name: Conmutatividad
    description: |
      propiedad de una operación en la que el cambio de orden de los operandos no afecta al resultado. Por ejemplo, la suma es una operación conmutativa: la suma no cambia al cambiar el orden de los sumandos.
